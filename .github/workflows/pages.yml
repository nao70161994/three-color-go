name: Deploy playable site
on:
  workflow_run:
    workflows: [Deploy random matchmaking]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The upstream Worker workflow only runs after main's tests succeed.
      # Publish frontend after the new API is already deployed.
      - name: Configure matchmaking service
        env:
          MATCHMAKER_URL: ${{ vars.MATCHMAKER_URL }}
        run: |
          node -e "const fs=require('node:fs');fs.writeFileSync('match-config.js','window.THREE_COLOR_MATCH_URL = '+JSON.stringify(process.env.MATCHMAKER_URL||'https://three-color-go-matchmaker.nao70161994.workers.dev')+';\\n')"
      - name: Verify public matchmaker health
        run: curl --fail --show-error --silent --retry 3 --retry-delay 2 https://three-color-go-matchmaker.nao70161994.workers.dev/health
      - run: npm run build:standalone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
