    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 6750
      target_iterations: 7000

  milestone_19:
    needs: milestone_18
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 7000
      target_iterations: 7250

  milestone_20:
    needs: milestone_19
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 7250
      target_iterations: 7500

  compare_all_milestones:
    needs: milestone_20
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore 20k baseline's 30 milestones
        uses: actions/download-artifact@v4
        with:
          run-id: 41610283160
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: architecture-milestone-*
          path: artifacts/
      - name: Restore the 60 new continuation milestones
        uses: actions/download-artifact@v4
        with:
          pattern: architecture-milestone-*
          path: artifacts/
      - name: Validate and compile all 90 milestone artifacts
        run: |
          set -euo pipefail
          python3 scripts/summarize-architecture-60k.py artifacts/ \
            reports/architecture-60k-summary.md reports/architecture-60k-summary.csv
          cat reports/architecture-60k-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-60k-final-summary
          path: reports/architecture-60k-summary.*
          retention-days: 90
