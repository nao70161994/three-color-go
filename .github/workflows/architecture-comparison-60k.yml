    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 6500
      target_iterations: 6750

  milestone_18:
