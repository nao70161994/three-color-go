name: Continue comparison 20k to 60k with 2k holdout evaluations
on:
  push:
    branches: [experiment/architecture-comparison-60k]
    paths: [.github/workflows/architecture-comparison-60k.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: architecture-comparison-60k
  cancel-in-progress: true
jobs:
  milestone_01:
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 2500
      target_iterations: 2750
      bootstrap_run_id: 41610283160

  milestone_02:
    needs: milestone_01
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 2750
      target_iterations: 3000

  milestone_03:
    needs: milestone_02
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 3000
      target_iterations: 3250

  milestone_04:
    needs: milestone_03
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 3250
      target_iterations: 3500

  milestone_05:
    needs: milestone_04
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 3500
      target_iterations: 3750

  milestone_06:
    needs: milestone_05
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 3750
      target_iterations: 4000

  milestone_07:
    needs: milestone_06
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 4000
      target_iterations: 4250

  milestone_08:
    needs: milestone_07
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 4250
      target_iterations: 4500

  milestone_09:
    needs: milestone_08
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 4500
      target_iterations: 4750

  milestone_10:
    needs: milestone_09
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 4750
      target_iterations: 5000

  milestone_11:
    needs: milestone_10
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    uses: ./.github/workflows/architecture-comparison-stage.yml
    with:
      kind: ${{ matrix.kind }}
      previous_iterations: 5000
