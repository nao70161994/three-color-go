name: embed verified trained PV2 checkpoints
on:
  push:
    branches: [feature/trained-direct-models-20261102]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  bake:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original frozen model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/frozen-strength-candidates
          gh run download 41409728999 --repo "$GITHUB_REPOSITORY" \
            --name frozen-strength-candidates --dir /tmp/frozen-strength-candidates
      - name: Verify checksums and embed original model parameters
        run: python3 scripts/embed-trained-models.py /tmp/frozen-strength-candidates
      - name: Regenerate offline HTML and commit deterministic generated assets
        run: |
          node scripts/build-standalone.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/trained-model-data.js play.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(ai): embed SHA-256 verified learned PV2 checkpoints"
          git push
