name: Build and verify square board + frozen learned CPU
on:
  push:
    branches: [feature/square-board-trained-cpu-20261107]
    paths:
      - .github/workflows/square-board-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the offline single-file edition
        run: npm run build:standalone
      - name: Validate all rules and model integration
        run: |
          npm test
          npm run check:standalone
      - name: Commit generated offline bundle to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          if ! git diff --cached --quiet; then
            git commit -m "Build standalone with square board and trained CPU"
            git push origin HEAD:feature/square-board-trained-cpu-20261107
          fi
