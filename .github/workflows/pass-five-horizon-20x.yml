name: 20x-horizon pass termination validation of five models
on:
  push:
    branches: [experiment/pass-five-horizon-sensitivity]
    paths: [.github/workflows/pass-five-horizon-20x.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate evaluation JS syntax
        run: |
          node --check scripts/benchmark-direct-matchups.mjs
          node --check scripts/benchmark-direct-headtohead.mjs
          node --check scripts/compare-direct-strength.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: pass-20k-*
          run-id: 41487742023
          github-token: ${{ github.token }}
          path: incoming
      - name: Verify five actual pass-trained checkpoints
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rates={'lr001':.001,'lr0003':.0003,'lr0001':.0001,'lr00003':.00003,'lr00001':.00001}
          Path('models').mkdir(exist_ok=True)
          signatures=set()
          for key,rate in rates.items():
              source=Path('incoming')/('pass-20k-'+key)/('pass-20k-'+key+'.json')
              model=json.loads(source.read_text())
              meta=model['metadata']
              assert model['architecture']=='hex-group-pv-16-v2'
              assert meta['games']==20000 and meta['passInLegalActions'] is True
              assert meta['optionalPassesSampled']>0
              assert abs(meta['learningRate']-rate)<1e-10
              assert abs(meta['initialPassMargin']-1.5)<1e-10
              assert 'model-102400.json' in meta['initializedFrom']
              assert len(model['layers']['pass']['weights'])==16
              signature=tuple(model['layers']['embed']['weights'][:16])
              assert signature not in signatures
              signatures.add(signature)
              (Path('models')/(key+'-pass20k.json')).write_text(json.dumps(model))
              print('Verified original 102400 + pass-inclusive 20000 games:',key)
          assert len(signatures)==5
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-five-pass-models
          path: models/
          retention-days: 30
  cpu:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        id: [lr001-pass20k, lr0003-pass20k, lr0001-pass20k, lr00003-pass20k, lr00001-pass20k]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frozen-five-pass-models
          path: models
      - name: Independent conventional-CPU matchups, radius 3 and 4
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "reports/cpu/$ID"
          for radius in 3 4; do
            if [[ "$radius" == 3 ]]; then seed=20471103; else seed=20471104; fi
            for group in hard-balanced balanced-balanced tactical-guarded baseline-baseline; do
              opponents=$(echo "$group" | tr '-' ',')
              node scripts/benchmark-direct-matchups.mjs \
                --model "models/$ID.json" --radius "$radius" \
                --games 48 --horizon-multiplier 20 --seed "$seed" --opponents "$opponents" \
                --out "reports/cpu/$ID/r$radius-$group.json" >/dev/null
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass20cpu-${{ matrix.id }}
          path: reports/cpu/${{ matrix.id }}/
          retention-days: 30
  duel:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {a: lr001-pass20k, b: lr0003-pass20k}
          - {a: lr001-pass20k, b: lr0001-pass20k}
          - {a: lr001-pass20k, b: lr00003-pass20k}
          - {a: lr001-pass20k, b: lr00001-pass20k}
          - {a: lr0003-pass20k, b: lr0001-pass20k}
          - {a: lr0003-pass20k, b: lr00003-pass20k}
          - {a: lr0003-pass20k, b: lr00001-pass20k}
          - {a: lr0001-pass20k, b: lr00003-pass20k}
          - {a: lr0001-pass20k, b: lr00001-pass20k}
          - {a: lr00003-pass20k, b: lr00001-pass20k}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frozen-five-pass-models
          path: models
      - name: All pairwise comparisons with third hard or balanced CPU
        env:
          A: ${{ matrix.a }}
          B: ${{ matrix.b }}
        run: |
          set -euo pipefail
          out="reports/duel/$A--$B"
          mkdir -p "$out"
          for radius in 3 4; do
            if [[ "$radius" == 3 ]]; then seed=20471203; else seed=20471204; fi
            for opponent in hard balanced; do
              node scripts/benchmark-direct-headtohead.mjs \
                --model-a "models/$A.json" --model-b "models/$B.json" \
                --radius "$radius" --games 48 --horizon-multiplier 20 --seed "$seed" \
                --opponent "$opponent" --out "$out/r$radius-$opponent.json" >/dev/null
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass20duel-${{ matrix.a }}--${{ matrix.b }}
          path: reports/duel/${{ matrix.a }}--${{ matrix.b }}/
          retention-days: 30
  compare:
    needs: [cpu, duel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: pass20cpu-*
          path: collected/cpu
      - uses: actions/download-artifact@v4
        with:
          pattern: pass20duel-*
          path: collected/duels
      - name: Summarize old vs extended-horizon 3840 held-out games
        run: |
          set -euo pipefail
          for dir in collected/cpu/pass20cpu-*; do
            id=$(basename "$dir")
            mkdir -p "compiled/cpu/${id#pass20cpu-}"
            cp "$dir/"*.json "compiled/cpu/${id#pass20cpu-}/"
          done
          for dir in collected/duels/pass20duel-*; do
            id=$(basename "$dir")
            mkdir -p "compiled/duels/${id#pass20duel-}"
            cp "$dir/"*.json "compiled/duels/${id#pass20duel-}/"
          done
          mkdir -p comparison
          node scripts/compare-direct-strength.mjs \
            compiled/cpu compiled/duels comparison/pass-five-horizon20-122400.json \
            | tee comparison/pass-five-horizon20-122400-summary.md
          cat comparison/pass-five-horizon20-122400-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-five-horizon20-strength-results
          path: comparison/
          retention-days: 30
