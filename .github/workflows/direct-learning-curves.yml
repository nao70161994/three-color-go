name: direct policy stone and capture learning curves
on:
  push:
    branches: [exp/direct-learning-curves]
  pull_request:
    paths:
      - scripts/direct-selfplay.mjs
      - scripts/train-direct-policy.py
      - scripts/report-direct-learning-curves.mjs
      - tests/direct-policy.test.js
      - .github/workflows/direct-learning-curves.yml
  workflow_dispatch:
jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/direct-policy.test.js tests/direct-lr-study.test.js
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Test stone trajectories and checkpoint serialization
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/train-direct-policy.py --iterations 2 --games 2 \
            --radii 2,3 --checkpoint-every 1 --learning-rate 0.0001 \
            --seed 711 --out reports/checkpoint-smoke.json \
            | tee reports/checkpoint-smoke.jsonl
          python scripts/check-pv2-parity.py reports/checkpoint-smoke-iter0001.json
          python scripts/check-pv2-parity.py reports/checkpoint-smoke-iter0002.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=[json.loads(line) for line in Path('reports/checkpoint-smoke.jsonl').read_text().splitlines() if line.startswith('{')]
          assert len(data)==2
          for row in data:
              assert len(row['meanSurvivingStones'])==3
              assert len(row['meanCapturedStones'])==3
              assert len(row['meanCapturedLosses'])==3
              assert abs(sum(row['meanFinalStoneShares'])-1)<1e-5
              assert abs(sum(row['meanCapturedStones'])-sum(row['meanCapturedLosses']))<1e-4
          PY
  study:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Learn 960 games at LR 0.0001, keep all final stones and captures
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/train-direct-policy.py \
            --iterations 120 --games 8 --radii 2,3,4 \
            --seed 20261101 --temperature 1 --learning-rate .0001 \
            --batch-size 32 --epochs 1 --entropy .015 --checkpoint-every 20 \
            --out reports/direct-960.json | tee reports/direct-learning-curve.jsonl
      - name: Check final policy serialization parity
        run: python scripts/check-pv2-parity.py reports/direct-960.json
      - name: Fixed opponent checks at 160, 320, 480, 640, 800, 960 games
        run: |
          set -euo pipefail
          for i in 20 40 60 80 100 120; do
            printf -v key '%04d' "$i"
            for r in 3 4; do
              if [[ "$r" == 3 ]]; then seed=20261121; else seed=20261122; fi
              for group in baseline-baseline hard-balanced; do
                node scripts/benchmark-direct-matchups.mjs \
                  --model "reports/direct-960-iter$key.json" \
                  --radius "$r" --games 6 --seed "$seed" \
                  --opponents "${group//-/,}" \
                  --out "reports/eval-iter$key-r$r-$group.json" > /dev/null
              done
            done
          done
      - name: Merge score/capture training curves with held-out evaluations
        run: |
          node scripts/report-direct-learning-curves.mjs \
            --training-log reports/direct-learning-curve.jsonl \
            --eval-prefix reports/eval --checkpoint-every 20 --iterations 120 \
            --out reports/direct-learning-curve-summary.json > /dev/null
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('reports/direct-learning-curve-summary.json','utf8'));
          const lines=['## No-search 3-player stone reward: 960 games',
            'Not deployed. Training selfplay mean reward is always 1/3 by symmetry.',
            '### Self-play final stones and captures (first/last five iterations for each radius)',
            '| Radius | Final stones/seat, early | Final stones/seat, late | Captures/seat, early | Captures/seat, late |',
            '|---|---|---|---|---|',
            ...x.byRadius.map(r=>'| '+r.radius+' | '+r.first.meanFinalSurvivingStonesPerSeat.join(',')+
              ' | '+r.last.meanFinalSurvivingStonesPerSeat.join(',')+' | '+
              r.first.meanCapturedStonesPerSeat.join(',')+' | '+r.last.meanCapturedStonesPerSeat.join(',')+' |'),
            '### Fixed opponents at checkpoint snapshots',
            '| Training games | Radius | Opponents | Neural mean final stone share | Mean stones |',
            '|---:|---:|---|---:|---:|',
            ...x.checkpoints.flatMap(c=>c.evaluations.map(e=>
              '| '+c.gamesTrained+' | '+e.radius+' | '+e.opponents.join(' + ')+
              ' | '+e.meanStoneShare+' | '+e.meanStones+' |'))];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-960-learning-curves
          path: reports/*
          retention-days: 30
