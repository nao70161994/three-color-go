name: Continue square deep GNN and Attention to 512 games per model
on:
  push:
    branches: [experiment/square-deep-gnn-attention-20261107]
    paths: [.github/workflows/square-deep-512.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: square-deep-512
  cancel-in-progress: false
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kind: [gnn16,gnn64,attn64]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/square-deep-gnn-attention-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and NumPy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Restore real 32-game Adam optimizer, policy and RNG state
        uses: actions/download-artifact@v4
        with:
          name: square-deep-${{ matrix.kind }}
          run-id: 42363941864
          path: reports/${{ matrix.kind }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resume from exactly 32 games; no reinitialization
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          test -f "reports/$KIND/model-iter0004.pt"
          python scripts/train-architecture-comparison.py \
            --kind "$KIND" --iterations 64 --games 8 \
            --radii=-9,-9,-9,-13 --seed 20261107 \
            --temperature 1.3 --learning-rate 0.0005 --entropy 0.015 \
            --batch-size 32 --horizon-multiplier 3 --timeout-penalty 0.3 \
            --sample-stride 8 --checkpoint-every 8 \
            --resume "reports/$KIND/model-iter0004.pt" \
            --out "reports/$KIND/model.json" \
            | tee "reports/$KIND/training-from32-to512.jsonl"
      - name: Verify genuine continuation, complete games and Python/JS parity
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          python scripts/check-architecture-parity.py "reports/$KIND/model.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path('reports')/os.environ['KIND']/'model.json').read_text())
          d=m['metadata']
          assert d['boardShape']=='square' and d['games']==512 and d['iterations']==64
          assert d['naturallyEndedGames']+d['truncatedGames']==512
          assert d['radii']==[-9,-9,-9,-13]
          print('Verified actual resumed square games:',os.environ['KIND'],d)
          PY
      - name: Independent 9x9 stochastic CPU benchmark with fresh seed
        env:
          KIND: ${{ matrix.kind }}
        run: |
          node scripts/architecture-benchmark.mjs \
            --model "reports/$KIND/model.json" --radius -9 \
            --games 12 --seed 20471118 --opponents balanced,tactical \
            --policy-mode sample --horizon-multiplier 3 \
            --out "reports/$KIND/eval-512-sample.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: square-deep-512-${{ matrix.kind }}
          path: reports/${{ matrix.kind }}/
          retention-days: 90
  summary:
    needs: [train]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: square-deep-512-*
          path: snapshots/
      - name: Compare natural endings and independent win rates
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=['# Square deep training: 32 to 512 actual self-play games','',
          '| Model | Self-play games | Natural endings | Independent finished games | Win share on completed games | Observed stone share |',
          '|---|---:|---:|---:|---:|---:|']
          def pc(v):return 'n/a' if v is None else f'{100*v:.1f}%'
          for kind in ['gnn16','gnn64','attn64']:
            p=Path('snapshots')/('square-deep-512-'+kind)
            m=json.loads((p/'model.json').read_text())['metadata']
            e=json.loads((p/'eval-512-sample.json').read_text())
            rows.append(f"| {kind} | {m['games']} | {m['naturallyEndedGames']}/{m['games']} | {e['finished']}/{e['games']} | {pc(e['finishedWinShare'])} | {pc(e['meanObservedStoneShare'])} |")
          rows+=['','No 19x19 training in this stage. Full-board Attention on 19x19 is a separate performance and strength risk.','Unfinished games have no win/loss classification; model weights remain experimental until evaluated.']
          report='\n'.join(rows)+'\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(report)
          Path('square-deep-512-report.md').write_text(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: square-deep-512-comparison
          path: square-deep-512-report.md
          retention-days: 90
