name: train pass-aware candidate checkpoints
on:
  push:
    branches: [fix/pass-action-in-policy-and-training]
    paths: [.github/workflows/train-pass-candidates.yml]
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fine-tune three previous winning checkpoints on pass-aware self-play
        run: |
          set -eo pipefail
          mkdir -p reports
          for id in trained-lr001-final trained-lr001-peak trained-lr0003-peak; do
            echo "TRAINING $id"
            ID="$id" node --input-type=module -e "import {getTrainedModel} from './src/trained-direct-ai.js';import {writeFileSync} from 'node:fs';writeFileSync('reports/pass-init.json',JSON.stringify(getTrainedModel(process.env.ID)))"
            python scripts/train-direct-policy.py --iterations 40 --games 8 --radii 2,3,4 --seed 20261103 --learning-rate 0.0003 --temperature 1.5 --init-model reports/pass-init.json --out "reports/$id-pass.json" | tee "reports/$id-learning.jsonl"
            python scripts/check-pv2-parity.py "reports/$id-pass.json"
          done
      - name: Record initial pass decisions and training counts
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createGame} from './src/game.js';
          import {directPolicy,selectDirectPolicyMove} from './src/direct-policy.js';
          const ids=['trained-lr001-final','trained-lr001-peak','trained-lr0003-peak'];
          const models={},diagnostics=[];
          for(const id of ids) {
            const m=JSON.parse(readFileSync('reports/'+id+'-pass.json'));
            const probes=[2,3,4,5].map(radius=>{
              const state=createGame(radius);
              const p=directPolicy(state,m);
              const selected=selectDirectPolicyMove(state,m,{greedy:true});
              return {radius,passProbability:p.probabilities.at(-1),passFirstMove:selected.action.type==='pass'};
            });
            diagnostics.push({id,trainedGames:m.metadata.games,optionalPasses:m.metadata.optionalPassesSampled,probes});
            models[id]=m;
          }
          writeFileSync('reports/pass-diagnostics.json',JSON.stringify(diagnostics,null,2));
          writeFileSync('src/pass-trained-model-data.js','// Experimental pass-aware PV2 fine-tuning; model provenance in metadata.\nexport const PASS_CHECKPOINTS='+JSON.stringify(models)+';\n');
          console.log(JSON.stringify(diagnostics,null,2));
          JS
      - name: Commit candidate models for review (not auto-deployed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pass-trained-model-data.js
          git commit -m "train: record pass-aware candidate checkpoints (not deployed)"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-aware-candidates
          path: reports/
          retention-days: 14
