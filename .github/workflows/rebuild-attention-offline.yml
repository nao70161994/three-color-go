name: Rebuild large-board Attention offline HTML
on:
  push:
    branches: [fix/attention-large-board-distance]
    paths:
      - .github/workflows/rebuild-attention-offline.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/attention-large-board-distance
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate offline bundle and verify exact output
        run: |
          npm run build:standalone
          npm run check:standalone
          node --test tests/elite-models.test.js
      - name: Commit generated HTML to the repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate offline HTML with large-board Attention fix"
            git push origin HEAD:fix/attention-large-board-distance
          fi
