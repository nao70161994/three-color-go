name: Rebuild offline pass-guard HTML
on:
  push:
    branches: [fix/pass-action-in-policy-and-training]
    paths: [.github/workflows/build-pass-guard-offline.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:standalone
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add play.html
          git diff --cached --quiet || (git commit -m 'build: sync offline pass-aware eye safety' && git push)
