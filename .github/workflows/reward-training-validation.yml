name: Signed reward training smoke (no forced passes)
on:
  pull_request:
    paths:
      - src/pv2-ai.js
      - src/direct-policy.js
      - scripts/check-pv2-parity.py
      - scripts/train-direct-reward.py
      - scripts/direct-reward-selfplay.mjs
      - tests/direct-reward.test.js
      - .github/workflows/reward-training-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-reward-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify JS syntax and unit tests
        run: |
          node --check scripts/direct-reward-selfplay.mjs
          node --test tests/direct-reward.test.js
      - name: Install CPU-only PyTorch and NumPy
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train four fresh on-policy games with signed reward
        run: |
          mkdir -p reports
          python scripts/train-direct-reward.py \
            --iterations 2 --games 2 --radii 2 \
            --seed 20261103 --temperature 1.5 \
            --horizon-multiplier 1 --timeout-penalty 0.3 \
            --checkpoint-every 1 --out reports/reward-smoke.json \
            | tee reports/reward-smoke.jsonl
      - name: Verify metadata and PyTorch JavaScript raw-value parity
        run: |
          python scripts/check-pv2-parity.py reports/reward-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("reports/reward-smoke.json").read_text())
          meta=m["metadata"]
          assert m["algorithm"]=="direct-reward-actor-critic-v2"
          assert meta["games"]==4
          assert meta["valueOutput"]=="independent"
          assert meta["timeoutPenalty"]==0.3
          assert meta["horizonMultiplier"]==1
          assert meta["naturallyEndedGames"]+meta["truncatedGames"]==4
          assert meta["initialPassMargin"] is None
          print("Signed reward metadata:",meta["naturallyEndedGames"],
                "natural and",meta["truncatedGames"],"censored")
          PY
      - name: Verify exact deterministic checkpoint resume
        run: |
          python scripts/train-direct-reward.py \
            --iterations 2 --games 2 --radii 2 \
            --seed 20261103 --temperature 1.5 \
            --horizon-multiplier 1 --timeout-penalty 0.3 \
            --checkpoint-every 1 --resume reports/reward-smoke-iter0001.pt \
            --out reports/reward-resumed.json \
            | tee reports/reward-resumed.jsonl
          cmp reports/reward-smoke.json reports/reward-resumed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reward-training-smoke
          path: reports/
          retention-days: 14
