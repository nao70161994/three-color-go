name: Final one-time offline regen for boosted square GNN
on:
  push:
    branches: [experiment/square-strength-teacher-20261115]
    paths: [.github/workflows/square-boost-rebundle-once.yml]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/square-strength-teacher-20261115
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          node scripts/materialize-square-boost.mjs
          npm test
          npm run build:standalone
          npm run check:standalone
      - name: Real browser smoke and offline parity
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/three-color-go-http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=40000 \
            --dump-dom http://localhost:8000/tests/browser-smoke.html >/tmp/smoke.html 2>/tmp/chrome.log
          grep 'data-status="passed"' /tmp/smoke.html || {
            head -c 15000 /tmp/smoke.html
            exit 1
          }
      - name: Commit exact HTML corresponding to all audited sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html src/square-boost-model-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync final offline HTML after improved GNN model labeling"
          git pull --rebase origin experiment/square-strength-teacher-20261115
          git push origin HEAD:experiment/square-strength-teacher-20261115
