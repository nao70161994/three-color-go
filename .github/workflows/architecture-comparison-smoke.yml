name: Compare GNN16 GNN64 attention64 smoke
on:
  pull_request:
    paths:
      - src/architecture-comparison.js
      - scripts/architecture-selfplay.mjs
      - scripts/architecture-benchmark.mjs
      - scripts/train-architecture-comparison.py
      - scripts/check-architecture-parity.py
      - scripts/predict-architecture.mjs
      - tests/architecture-comparison.test.js
      - .github/workflows/architecture-comparison-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  architectures:
    strategy:
      fail-fast: false
      matrix:
        kind: [gnn16, gnn64, attn64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JS legal-play and architecture tests
        run: |
          node --check src/architecture-comparison.js
          node --test tests/architecture-comparison.test.js
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train four independent signed-reward episodes
        env:
          KIND: ${{ matrix.kind }}
        run: |
          mkdir -p reports/"$KIND"
          python scripts/train-architecture-comparison.py \
            --kind "$KIND" --iterations 2 --games 2 --radii 2 \
            --horizon-multiplier 1 --timeout-penalty 0.3 \
            --sample-stride 2 --checkpoint-every 1 \
            --seed 20261103 --out "reports/$KIND/model.json" \
            | tee "reports/$KIND/train.jsonl"
      - name: Check model parity, metadata and heldout evaluations
        env:
          KIND: ${{ matrix.kind }}
        run: |
          python scripts/check-architecture-parity.py "reports/$KIND/model.json"
          node scripts/architecture-benchmark.mjs \
            --model "reports/$KIND/model.json" --radius 2 \
            --games 6 --seed 20471104 --horizon-multiplier 3 \
            --out "reports/$KIND/eval.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          kind=os.environ['KIND']
          model=json.loads((Path('reports')/kind/'model.json').read_text())
          assert model['kind']==kind
          assert model['metadata']['games']==4
          assert model['metadata']['phaseFeature'] is False
          assert model['metadata']['valueOutput']=='independent'
          assert model['layers']['embed']['cols']==10
          assert model['metadata']['naturallyEndedGames']+model['metadata']['truncatedGames']==4
          print('Validated architecture',kind)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-smoke-${{ matrix.kind }}
          path: reports/${{ matrix.kind }}/
          retention-days: 14
