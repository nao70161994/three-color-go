name: evaluate pass decisions and eye safety (after guard)
on:
  push:
    branches: [fix/pass-action-in-policy-and-training]
    paths: [.github/workflows/evaluate-pass-endgame.yml]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run trained models through completed games with eye diagnostics
        run: |
          node --input-type=module <<'JS'
          import {createGame,play,pass} from './src/game.js';
          import {chooseTrainedMove,TRAINED_LEVELS} from './src/trained-direct-ai.js';
          import {isOwnEye,safeCpuMoves,legalMoves,chooseMove,seededRandom} from './src/agent.js';
          for(const id of TRAINED_LEVELS){
            let games=0,ended=0,totalTurns=0,ownEyes=0,ownEyeNoSafe=0,earlyPasses=0,optionalPasses=0,forcedPasses=0;
            for(const radius of [2,3]){
              for(let i=0;i<12;i++){
                const state0=createGame(radius),random=seededRandom(20261105+i*151+radius*100),trainedSeat=i%3;
                let state=state0,turns=0;
                while(!state.ended&&turns<3* (3*radius*(radius+1)+1)){
                  const trained=state.turn===trainedSeat;
                  const move=trained?chooseTrainedMove(state,id):chooseMove(state,random,'balanced');
                  if(trained){
                    if(move){
                      if(isOwnEye(state,move.q,move.r)){
                        ownEyes++;
                        if(safeCpuMoves(state).length===0)ownEyeNoSafe++;
                      }
                    }else{
                      if(legalMoves(state).length){optionalPasses++;if(turns<9)earlyPasses++;}
                      else forcedPasses++;
                    }
                  }
                  const outcome=move?play(state,move.q,move.r):pass(state);
                  if(!outcome.ok)throw Error(id+' illegal action: '+outcome.reason);
                  state=outcome.state;turns++;
                }
                games++;if(state.ended)ended++;totalTurns+=turns;
              }
            }
            const out={id,games,ended,meanTurns:totalTurns/games,ownEyes,ownEyeNoSafe,earlyPasses,optionalPasses,forcedPasses};
            console.log(JSON.stringify(out));
          }
          JS
