name: build pass action offline HTML
on:
  push:
    branches: [fix/pass-action-in-policy-and-training]
permissions:
  contents: write
jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:standalone
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add play.html
          git diff --cached --quiet || (git commit -m 'build: update offline pass support' && git push)
