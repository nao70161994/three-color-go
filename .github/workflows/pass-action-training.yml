name: pass-action self-play training check
on:
  pull_request:
    paths:
      - src/direct-policy.js
      - scripts/direct-selfplay.mjs
      - scripts/train-direct-policy.py
      - scripts/train-pv2-selfplay.py
      - scripts/check-pv2-parity.py
      - tests/direct-policy.test.js
      - tests/trained-direct-ai.test.js
      - .github/workflows/pass-action-training.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/direct-policy.test.js tests/trained-direct-ai.test.js
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fine-tune a trained checkpoint with pass as a real competing action
        run: |
          node --input-type=module -e "import {getTrainedModel} from './src/trained-direct-ai.js';import {writeFileSync} from 'node:fs';writeFileSync('pass-init.json',JSON.stringify(getTrainedModel('trained-lr001-final')))"
          python scripts/train-direct-policy.py --iterations 2 --games 2 --radii 2,3 --seed 711 --learning-rate 0.0003 --init-model pass-init.json --out reports/pass-smoke.json
          python scripts/check-pv2-parity.py reports/pass-smoke.json
          node scripts/direct-selfplay.mjs --model reports/pass-smoke.json --games 2 --radius 2 --seed 891 > reports/pass-smoke-rollouts.jsonl
          python - <<'PY'
          import json
          model=json.load(open('reports/pass-smoke.json'))
          assert model['metadata']['passInLegalActions']
          samples=[json.loads(line) for line in open('reports/pass-smoke-rollouts.jsonl')]
          assert all(all(19 in s['legal'] for s in g['samples']) for g in samples)
          print('Pass correctly included in policy gradient training examples')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass-action-training-smoke
          path: |
            reports/pass-smoke.json
            reports/pass-smoke-rollouts.jsonl
          retention-days: 7
