name: tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check:standalone
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify real browser play and agent API
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/three-color-go-http.log 2>&1 &
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [[ -z "$CHROME" ]]; then echo "Chromium/Chrome unavailable"; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=25000 \
            --dump-dom http://localhost:8000/tests/browser-smoke.html >/tmp/three-color-go-smoke.html 2>/tmp/chrome.log
          grep 'data-status="passed"' /tmp/three-color-go-smoke.html || {
            cat /tmp/three-color-go-smoke.html
            cat /tmp/chrome.log
            exit 1
          }

  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seeded tactical self-play (300 games)
        run: node scripts/analyze.mjs --games 300 --seed 20261031 --radius 3 --samples 3 --out reports/tactical-300.json > /tmp/selfplay.json
      - name: Compare versus old CPU in rotating seats (90 games)
        run: node scripts/analyze.mjs --compare --games 30 --seed 20261031 --radius 3 --samples 3 --out reports/rotated-90.json > /tmp/rotated.json
      - name: Summarize measurements
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const a=JSON.parse(fs.readFileSync('/tmp/selfplay.json'));
            const b=JSON.parse(fs.readFileSync('/tmp/rotated.json'));
            const msg=[
              '### Three-color hex Go v0.3 seeded analysis',
              'Self-play: '+a.finished+'/'+a.settings.games+' finished, '+a.truncated+' truncated',
              'Turns (mean): '+a.averageTurns+', occupancy (mean): '+a.averageOccupancy,
              'Black / white / red win-share: '+JSON.stringify(a.winShare),
              'Captures: '+a.captures+', captured stones: '+a.capturedStones+', joint captures: '+a.jointCaptures,
              'Tactical against 2 baseline opponents, rotated across seats: '+b.finished+'/'+b.settings.games+' finished',
              'Tactical win rate (ties split): '+b.tacticalWinRate,
              'Per-seat tactical win rates: '+JSON.stringify(b.seats.map(x=>x.tacticalWinRate))
            ].join('\\n');
            console.log(msg);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,msg+'\\n');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: seeded-analysis-v0.3
          path: reports/*.json
          retention-days: 30

  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure seat bias and endgame quality (90 games)
        run: node scripts/balance.mjs --games 90 --radius 3 --seed 20261031 --samples 3 --out reports/balance-v0.6.json > /tmp/balance.json
      - name: Compare balanced CPU against guarded CPU in rotated seats (90 games)
        run: node scripts/balance.mjs --matchup --games 30 --radius 3 --seed 20261031 --samples 3 --out reports/matchup-v0.6.json > /tmp/matchup.json
      - name: Publish readable balance summary
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/balance.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/matchup.json','utf8'));
          if(a.finished+a.truncated!==90 || b.finished+b.truncated!==90) process.exit(1);
          const lines=[
            '## Three Color Hex Go v0.6 - seeded balance study',
            '### Balanced-vs-balanced: 90 games, seed 20261031, radius 3',
            'Finished: '+a.finished+'; truncated: '+a.truncated+'; ties: '+a.ties,
            'Win rates: '+JSON.stringify(a.seats.map(x=>({seat:x.color,rate:x.winRate}))),
            'Average moves: '+a.averages.turns,
            'Average final occupancy: '+a.averages.occupancy,
            'High occupancy >=80%: '+a.highOccupancyFraction,
            'Last-third non-capture move fraction: '+a.averages.lastThirdNonCaptureFraction,
            'Average lead changes: '+a.averages.leadChanges,
            'Joint captures: '+a.jointCaptures,
            '### Balanced vs two guarded: 90 games, alternating challenger seat',
            'Finished: '+b.finished+'; truncated: '+b.truncated,
            'Balanced win rate with ties split: '+b.challengerWinRate,
            'Win rates by challenger seat: '+JSON.stringify(b.seats.map(x=>({seat:x.color,rate:x.winRate}))),
            '**Caution:** These are seeded bot outcomes, not human balance statistics. High occupancy is a proxy, not proof of boring play.'
          ];
          const summary=lines.join('\n')+'\n';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report-v0.6
          path: reports/*.json
          retention-days: 30

  strength:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 60-game seat-rotated strong CPU benchmark
        run: node scripts/strength-report.mjs --games 60 --radius 3 --seed 20261031 --out reports/strong-v0.7.json > /tmp/strength.json
      - name: Publish outcome, not assumptions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/strength.json','utf8'));
          if(r.finished+r.truncated!==r.games)process.exit(1);
          const summary=[
            '## v0.7: Strong lookahead versus two v0.6 balanced CPUs',
            'Games: '+r.games+'; finished: '+r.finished+'; incomplete: '+r.truncated,
            'Strong CPU winning share: '+r.winShare+'; win rate (ties split): '+r.winRate,
            'Per seat: '+JSON.stringify(r.seats),
            'Average moves: '+r.averageTurns,
            'Caution: small sample and AI-only results, not proven human-play strength.'
          ].join('\n')+'\n';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: strength-v0.7
          path: reports/strong-v0.7.json
          retention-days: 30

  size-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run comparative board size study
        run: node scripts/size-study.mjs --games 3 --seed 20261031 --out reports/size-study-v1.1.json > /tmp/size-study.json
      - name: Verify data is readable and games are accounted for
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/size-study.json'));
          if(r.sizes.length!==4 || r.sizes.some(x=>x.finished+x.truncated!==3))process.exit(1);
          const lines=[
            '## v1.1 cross-board-size study',
            '3 seeded self-play games per radius, balanced bot policy',
            ...r.sizes.map(x=>x.cells+' cells: finished '+x.finished+'/3, turns '+x.averageTurns+
              ', occupancy '+x.occupancy+', black/white/red win rate '+
              [x.blackWinRate,x.whiteWinRate,x.redWinRate].join('/')),
            'Low sample size: descriptive statistics only.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: cross-size-study-v1.1
          path: reports/size-study-v1.1.json
          retention-days: 30
