name: Build custom seating offline HTML
on:
  push:
    branches: [feature/custom-seats-and-cpu-agents]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:standalone
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add play.html
          git diff --cached --quiet || (git commit -m 'build: update offline HTML' && git push)
