name: Publish verified square deep 32-game checkpoints and evaluate sampled policy
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/square-deep-publish.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: square-deep-publish-20261107
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/square-deep-gnn-attention-20261107
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore all three verified self-play model artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 42363941864
          pattern: square-deep-*
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate provenance and freeze real GNN and Attention weights
        run: |
          node scripts/materialize-square-deep.mjs artifacts src/square-deep-model-data.js
      - name: Evaluate actual sampling policy against fixed CPU with rotated seats
        run: |
          set -euo pipefail
          mkdir -p reports/square-deep-new
          for KIND in gnn16 gnn64 attn64; do
            node scripts/architecture-benchmark.mjs \
              --model "artifacts/square-deep-$KIND/model.json" \
              --radius -9 --games 12 --seed 20471108 \
              --opponents balanced,tactical --policy-mode sample \
              --horizon-multiplier 3 \
              --out "reports/square-deep-new/eval-$KIND-sample.json"
          done
      - name: Build offline HTML and test genuine learned models
        env:
          REQUIRE_SQUARE_DEEP_MODELS: '1'
        run: |
          npm run build:standalone
          npm test
          npm run check:standalone
      - name: Record both greedy and sampled-policy evaluations
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          names=('gnn16','gnn64','attn64')
          lines=['# Square-board deep AI initial evaluation','',
            '| Model | Trained games | Greedy wins | Sampled finished | Sampled win share | Sampled mean stone share | Sampled early passes |',
            '|---|---:|---:|---:|---:|---:|---:|']
          def pc(v):
              return 'n/a' if v is None else f'{100*v:.1f}%'
          for kind in names:
              origin=Path('artifacts')/('square-deep-'+kind)
              m=json.loads((origin/'model.json').read_text())
              g=json.loads((origin/'eval-9.json').read_text())
              e=json.loads((Path('reports/square-deep-new')/('eval-'+kind+'-sample.json')).read_text())
              lines.append(f"| {kind} | {m['metadata']['games']} | {pc(g['finishedWinShare'])} | {e['finished']}/{e['games']} | {pc(e['finishedWinShare'])} | {pc(e['meanObservedStoneShare'])} | {e['earlyPassCount']} |")
          lines+=['','The sampled policy is the same trained policy distribution used for self-play, with random legal action sampling and no pass veto. These are exploratory 32-game checkpoints, not proven strong CPUs.','19×19 is inference-only and has no square self-play training in this checkpoint.']
          report='\n'.join(lines)+'\n'
          Path('reports/square-deep-new/summary.md').write_text(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(report)
          print(report)
          PY
      - name: Commit only true tested checkpoints and reproducible offline app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/square-deep-model-data.js play.html
          git add -f reports/square-deep-new/summary.md
          git commit -m "Freeze verified square self-play networks and compare sampled policies"
          git push origin HEAD:experiment/square-deep-gnn-attention-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: square-deep-sampling-evaluation
          path: reports/square-deep-new/
          retention-days: 90
