name: Rebuild pure-policy offline app
on:
  push:
    branches: [fix/pure-policy-and-five-pass-finetunes]
    paths: [.github/workflows/one-time-pure-policy-bundle.yml]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:standalone
      - name: Commit updated play.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          git diff --cached --quiet || (git commit -m "build: offline PV2 without tactical eye mask" && git push)
