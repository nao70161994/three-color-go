name: Regenerate final audited offline edition
on:
  push:
    branches: [fix/full-repo-audit-20261114]
    paths: [.github/workflows/regenerate-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-repo-audit-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm run build:standalone
          npm test
          npm run check:standalone
      - name: Publish exact standalone generated HTML
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate final audited standalone HTML"
            git pull --rebase origin fix/full-repo-audit-20261114
            git push origin HEAD:fix/full-repo-audit-20261114
          fi
