name: fine tune calibrated pass-capable PV2 checkpoints
on:
  push:
    branches: [fix/pass-action-in-policy-and-training]
    paths: [.github/workflows/train-pass-calibrated.yml]
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Calibrate pass head and continue real on-policy self-play
        run: |
          set -eo pipefail
          mkdir -p reports
          for id in trained-lr001-final trained-lr001-peak trained-lr0003-peak; do
            echo "CALIBRATED PASS FINE TUNING: $id"
            ID="$id" node --input-type=module -e "import {PASS_CHECKPOINTS} from './src/pass-trained-model-data.js';import {writeFileSync} from 'node:fs';writeFileSync('reports/pass-init.json',JSON.stringify(PASS_CHECKPOINTS[process.env.ID]))"
            python scripts/train-direct-policy.py --iterations 15 --games 8 --radii 2,3,4 --seed 20261104 --learning-rate 0.0003 --temperature 1.5 --init-model reports/pass-init.json --init-pass-margin 1.5 --out "reports/$id-pass.json" | tee "reports/$id-learning.jsonl"
            python scripts/check-pv2-parity.py "reports/$id-pass.json"
          done
      - name: Verify opening placements and preserve candidate exports
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createGame} from './src/game.js';
          import {directPolicy,selectDirectPolicyMove} from './src/direct-policy.js';
          import {PASS_CHECKPOINTS} from './src/pass-trained-model-data.js';
          const ids=Object.keys(PASS_CHECKPOINTS);
          const models={},diagnostics=[];
          for(const id of ids) {
            const m=JSON.parse(readFileSync('reports/'+id+'-pass.json'));
            const probes=[2,3,4,5].map(radius=>{
              const state=createGame(radius);
              const p=directPolicy(state,m);
              const choice=selectDirectPolicyMove(state,m,{greedy:true});
              return {radius,passProbability:p.probabilities.at(-1),passAtStart:choice.action.type==='pass'};
            });
            diagnostics.push({id,passMargin:m.metadata.initialPassMargin,
              optionalPasses:m.metadata.optionalPassesSampled,probes});
            models[id]=m;
          }
          console.log(JSON.stringify(diagnostics,null,2));
          writeFileSync('reports/pass-diagnostics.json',JSON.stringify(diagnostics,null,2));
          if(diagnostics.some(d=>d.probes.some(p=>p.passAtStart))){
            console.error('Opening pass persists: do not promote this model');
            process.exitCode=1;
          }else{
            writeFileSync('src/pass-trained-model-data.js',
              '// Pass-aware PV2 checkpoints after outcome-only self-play and documented opening initialization.\nexport const PASS_CHECKPOINTS='+JSON.stringify(models)+';\n');
          }
          JS
      - name: Commit calibrated candidates for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pass-trained-model-data.js
          git commit -m "train: pass-aware models with corrected opening calibration"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrated-pass-candidates
          path: reports/
          retention-days: 14
