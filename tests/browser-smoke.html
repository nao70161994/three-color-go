<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三色六角碁 · ブラウザ動作確認</title>
<style>
body{font:15px system-ui,sans-serif;background:#101a22;color:#eaf0f5;max-width:860px;margin:auto;padding:20px}
#status{display:block;padding:14px;border:1px solid #60788a;border-radius:12px;margin:12px 0}
iframe{width:min(100%,390px);height:844px;border:1px solid #4a6476;border-radius:15px}
pre{white-space:pre-wrap} .ok{color:#a8e5bd}.fail{color:#ffaaaa}
</style>
</head>
<body>
<h1>三色六角碁 — ブラウザ動作確認</h1>
<p>実際のゲーム画面を開き、UIと公開APIを使って操作します。右の開発者ツールがなくても結果を確認できます。</p>
<output id="status" data-status="running">テスト中…</output>
<pre id="log"></pre>
<iframe id="game" title="テスト用の三色六角碁" src="../index.html"></iframe>
<script>
const status=document.getElementById('status');
const log=document.getElementById('log');
const frame=document.getElementById('game');
const lines=[];
const check=(condition,label)=>{
  if(!condition) throw new Error(label);
  lines.push('PASS: '+label);log.textContent=lines.join('\n');
};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function run(){
  const win=frame.contentWindow, doc=frame.contentDocument, game=win.threeColorGo;
  check(game && typeof game.getState==='function','AI操作用APIが存在');
  check(game.version==='1.4.1','公開APIのバージョンがv1.4.1');
  check(doc.querySelector('#boardSize').value==='4','初期サイズは半径4・61マス');
  check(doc.querySelector('#replayOpen').disabled,'棋譜が空なら再生ボタンは無効');
  check(doc.querySelector('#boardSize option[value="3"]').textContent.includes('小（37マス）'),'新しい小サイズは37マス');
  check(doc.querySelector('#boardSize option[value="2"]').disabled,'旧19マスは新規選択できない');
  check(doc.querySelector('#boardSize option[value="6"]')!==null,'127マスを選べる');
  check(doc.querySelector('#mode option[value="bots"]')!==null,'CPU3人観戦モードを選べる');
  check(doc.querySelector('#boardSize option[value="11"]').textContent.includes('397'),'19路盤の361交点を超える397マスが選べる');
  check(doc.querySelector('#boardSize option[value="12"]').textContent.includes('469'),'469マスが選べる');
  check(game.reset({mode:'local',radius:2,cpuLevel:'easy'}).ok,'3人交代モードで初期化');
  check(game.getPresentation().cpuLevel==='easy','CPU難易度を指定して初期化');
  check(doc.getElementById('cpuSetting').hidden,'3人交代中はCPU設定を隠す');
  check(doc.getElementById('legalToggle').getAttribute('aria-pressed')==='false','合法手ガイドは初期OFF');
  doc.getElementById('legalToggle').click();
  check(game.getPresentation().showLegal,'合法手ガイドをONにできる');
  check(doc.querySelectorAll('.hintLegal').length===19,'合法手19点が画面に表示される');
  check(game.legalMoves().length===19,'半径2の合法手は19');
  check(doc.querySelectorAll('g.cell').length===19,'画面に19マス表示');
  check(doc.querySelector('#boardSize').value==='2','旧19マスの保存盤面でも表示できる');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,'スマホ幅390pxで横スクロールなし');
  doc.querySelector('g.cell[data-q="0"][data-r="0"]').dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
  check(game.getState().scores.black===1,'盤面クリックで黒石を置ける');
  check(doc.querySelectorAll('.hintLast').length===1,'直前の着手の金色リングが表示される');
  check(doc.querySelector('g.cell[data-q="0"][data-r="0"] .hintLast')!==null,'直前に打った石を正確に示す');
  check(doc.querySelectorAll('.hintLegal').length===18,'置いたマスが合法手表示から消える');
  doc.getElementById('legalToggle').click();
  check(!game.getPresentation().showLegal && doc.querySelectorAll('.hintLegal').length===0,'合法手をOFFにできる');
  check(game.pass().ok,'白がパスできる');
  check(game.play(1,0).ok,'赤が着手できる');
  check(game.getState().scores.red===1,'赤石が得点に反映');
  check(!!doc.getElementById('downloadRecord'),'棋譜JSONのバックアップ操作がある');
  check(doc.querySelectorAll('g.cell[tabindex="0"]').length===1,'盤面のTab移動先は1マスに制限');
  const record=game.exportRecord();
  check(record.actions.length===3,'棋譜が出力できる');
  const beforeReplay=JSON.stringify(game.getState());
  check(game.openReplay().ok,'対局途中でも棋譜を開ける');
  check(!doc.querySelector('#replayPanel').hidden,'棋譜再生UIが表示される');
  check(doc.querySelector('#replaySlider').max==='3','再生範囲が手数と一致');
  check(game.seekReplay(0).ok,'棋譜の開始位置に移動');
  check(game.getReplayState().state.scores.black===0,'初期局面は0点');
  check(doc.querySelectorAll('g.cell .piece').length===0,'初期局面を画面に表示');
  check(!game.play(0,1).ok && !game.pass().ok && !game.undo().ok,
    '棋譜再生中は対局の着手・パス・Undoを拒否');
  check(!game.seekReplay(-1).ok && !game.seekReplay(4).ok,'範囲外の再生位置を拒否');
  doc.querySelector('#replayNext').click();
  check(game.getReplayState().index===1 && game.getReplayState().state.scores.black===1,
    '次へ操作で黒の着手を表示');
  doc.querySelector('#replaySlider').value='2';
  doc.querySelector('#replaySlider').dispatchEvent(new win.Event('input',{bubbles:true}));
  check(game.getReplayState().index===2,'スライダーから手番を移動');
  doc.querySelector('#replayEnd').click();
  check(game.getReplayState().index===3 && game.getReplayState().state.scores.red===1,
    '最後へ操作で元の盤面を表示');
  check(game.closeReplay().ok,'棋譜再生を終了');
  check(doc.querySelector('#replayPanel').hidden,'再生パネルを閉じる');
  check(JSON.stringify(game.getState())===beforeReplay,'再生は元の対局を一切変更しない');
  check(game.undo().ok,'一手戻せる');
  check(game.importRecord(record).ok,'棋譜を読み込める');
  check(game.getState().scores.red===1,'棋譜から同じ盤面を復元');
  check(game.analyze().stats.moves===2 && game.analyze().stats.passes===1,
    'v0.9の対局分析で着手とパスを正確に集計');
  check(game.explainPosition().scores.red===1,'局面の理由・危険度分析API');
  check(!game.importRecord({radius:2,actions:[{type:'play',q:500,r:500}]}).ok,'不正な棋譜を拒否');
  check(game.setCpuLevel('normal').ok && game.getPresentation().cpuLevel==='normal','CPU難易度を試合中にも切り替えられる');
  check(!game.setCpuLevel('invalid').ok && game.getPresentation().cpuLevel==='normal','不明な難易度は拒否する');
  check(!game.setHints({legal:'yes'}).ok,'不正な表示設定を拒否する');
  check(game.setHints({legal:true,danger:false}).ok,'ブラウザAPIから表示設定を操作できる');
  check(doc.getElementById('dangerToggle').getAttribute('aria-pressed')==='false','表示トグルの状態が同期される');
  const saved=JSON.parse(win.localStorage.getItem('three-color-go.v2'));
  check(saved.cpuLevel==='normal' && saved.showLegal && !saved.showDanger,'CPUと表示設定が自動保存される');
  check(game.reset({mode:'cpu',radius:2,cpuLevel:'normal'}).ok,'1人+CPU2人モードに切り替え');
  check(game.reset({mode:'local',radius:5}).ok,'91マスの大きな盤で開始');
  check(doc.querySelectorAll('g.cell').length===91,'91マスの盤面が描画される');
  check(doc.querySelector('#boardSize').value==='5','盤面サイズのUIが追従');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,
    '91マスでも390px画面で横スクロールなし');
  doc.querySelector('#boardSize').value='3';
  doc.querySelector('#boardSize').dispatchEvent(new win.Event('change',{bubbles:true}));
  check(game.getState().radius===3,'盤面サイズ選択で37マスに変更できる');
  check(doc.querySelectorAll('g.cell').length===37,'サイズ変更後の37マスを描画');
  check(game.reset({mode:'local',radius:6}).ok,'127マスの特大盤で開始できる');
  check(doc.querySelectorAll('g.cell').length===127,'127マスが画面に描画される');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,
    '127マスでも横スクロールしない');
  check(game.reset({mode:'local',radius:11,cpuLevel:'easy'}).ok,'半径11・397マスで初期化');
  check(doc.querySelectorAll('g.cell').length===397,'397マス描画');
  const initialMoves=game.getState().moveCount;
  const largeCell=doc.querySelector('g.cell[data-q="0"][data-r="0"]');
  largeCell.dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
  check(game.getState().moveCount===initialMoves+1,
    '397マスでも1回タップで石を置ける');
  check(doc.querySelector('#moveConfirm')===null,
    '大型盤面でも画面を覆う確認バーは表示されない');
  check(doc.querySelector('#boardViewTools').compareDocumentPosition(doc.querySelector('#boardPanel'))
    & win.Node.DOCUMENT_POSITION_FOLLOWING,
    '拡大ボタンは盤面より上に配置');
  check(doc.querySelector('#boardViewTools').hidden===false,'巨大盤面では拡大切り替えが表示される');
  check(!game.getPresentation().zoomBoard,'巨大盤面の初期設定は全体表示');
  check(doc.querySelector('#board').getBoundingClientRect().width<=doc.querySelector('#boardPanel').getBoundingClientRect().width+2,'397マスは最初から盤全体が画面幅に収まる');
  check(doc.querySelector('#boardZoom').textContent==='拡大して打つ','初期ボタンに拡大操作を表示');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,'397マスでもページ全体に横スクロールなし');
  doc.querySelector('#boardZoom').click();
  check(game.getPresentation().zoomBoard,'拡大表示へ切り替えられる');
  check(doc.querySelector('#board').getBoundingClientRect().width>600,'拡大時は盤面が押しやすい大きさになる');
  check(game.exportRecord().zoomBoardExplicit===true,'手動設定が棋譜に記録される');
  check(game.importRecord(game.exportRecord()).ok && game.getPresentation().zoomBoard,'手動拡大設定は棋譜復元でも維持');
  check(game.setBoardZoom(false).ok && !game.getPresentation().zoomBoard,'全体表示へ戻せる');
  check(game.importRecord({version:1,mode:'local',radius:11,zoomBoard:true,actions:[]}).ok &&
    !game.getPresentation().zoomBoard,'旧セーブの自動拡大は新しい標準の全体表示へ移行');
  check(game.reset({mode:'local',radius:12,cpuLevel:'easy'}).ok,'半径12・469マスで初期化');
  check(doc.querySelectorAll('g.cell').length===469,'469マス描画');
  check(!game.getPresentation().zoomBoard,'469マスでも全体表示が初期設定');
  check(doc.querySelector('#board').getBoundingClientRect().width<=doc.querySelector('#boardPanel').getBoundingClientRect().width+2,'469マスが画面幅に収まる');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,'469マスでも横スクロールなし');
  check(game.legalMoves().length===469,'469マスの合法手をエンジンから取得');
  check(game.reset({mode:'local',radius:10}).ok,'スクリーンショットと同じ331マス盤面に切替');
  const target=doc.querySelector('g.cell[data-q="7"][data-r="-3"]');
  target.dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
  check(game.getState().moveCount===1 && game.getState().board['7,-3']==='black',
    '331マス盤で選択した地点へ1タップで着手');
  check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth+2,
    '331マスでもページ横スクロールなし');
  check(game.reset({mode:'local',radius:4,cpuLevel:'hard'}).ok,'標準61マス・強いCPUの対局を初期化');
  const begin=performance.now();
  const thought=game.autoPlay(1,99);
  const elapsed=performance.now()-begin;
  check(thought.ok && thought.moves===1,'標準盤面で強いCPUが合法手を生成');
  const trace=game.getCpuDecision();
  check(trace && trace.candidates.length>0,'CPUが比較した候補と評価値を取得');
  check(trace.candidates[0].score>=trace.candidates.at(-1).score,'CPU候補が評価値順に並ぶ');
  check(elapsed<10000,'標準盤面のCPUの思考が10秒未満');
  check(game.reset({mode:'bots',radius:3,cpuLevel:'easy'}).ok,'CPU3人の観戦モードを開始できる');
  check(!doc.querySelector('#spectatorControls').hidden,'観戦操作欄が表示される');
  check(game.getPresentation().mode==='bots','観戦モードがブラウザAPIで取得できる');
  // External agents are allowed to play moves; spectators cannot click the board.
  check(game.pauseBots().ok,'CPU3人の対局を一時停止');
  const paused=game.getState().moveCount;
  await sleep(230);
  check(game.getState().moveCount===paused,'一時停止中は自動着手しない');
  doc.querySelector('g.cell[data-q="1"][data-r="1"]').dispatchEvent(new win.MouseEvent('click',{bubbles:true}));
  check(game.getState().moveCount===paused,'観戦者の盤面クリックでは着手できない');
  check(game.stepBot().ok,'一時停止中にCPUの1手を進められる');
  check(game.getState().moveCount===paused+1,'1手進める操作は正確に1手');
  check(game.setSpectatorSpeed(180).ok,'観戦速度を速くできる');
  check(!game.setSpectatorSpeed(17).ok,'不正な速度を拒否');
  check(game.resumeBots().ok,'CPU3人の自動対局を再開');
  await sleep(680);
  check(game.getState().moveCount>=paused+2,'3人のCPUが自動着手を継続');
  check(game.pauseBots().ok,'観戦中に再度一時停止');
  const botsRecord=game.exportRecord();
  check(botsRecord.mode==='bots' && botsRecord.spectatorPaused,'観戦状態を棋譜へ保存');
  check(game.openReplay().ok,'CPU3人の対局も棋譜再生できる');
  check(game.seekReplay(0).ok,'CPU3人の開始局面も再生できる');
  check(game.closeReplay().ok,'再生を閉じてもCPU3人の対局は一時停止のまま');
  check(game.getState().moveCount===botsRecord.actions.length,'棋譜再生はCPU3人の対局を変更しない');
  check(game.importRecord(botsRecord).ok && game.getPresentation().spectatorPaused,
    '観戦棋譜の再読み込みは意図しないCPU自動進行を開始しない');
  check(game.reset({mode:'bots',radius:2,cpuLevel:'easy'}).ok,'CPU3人の終局テストを開始');
  check(game.pauseBots().ok,'終局テストは一時停止して制御');
  const finishedBots=game.autoPlay(70,21);
  check(finishedBots.ok && finishedBots.state.ended,'CPU3人で最初から最後まで対局できる');
  check(finishedBots.state.moveCount>3 && finishedBots.state.consecutivePasses===3,
    'CPU3人の対局は3連続パスで正常に終局する');
  check(doc.querySelector('#spectatorStep').disabled,'終局後の1手進めるを無効化');
  check(game.reset({mode:'cpu',radius:2,cpuLevel:'normal'}).ok,'CPU対戦モードへ戻る');
  check(!doc.getElementById('cpuSetting').hidden,'CPU対戦中に難易度の選択欄が見える');
  check(game.play(0,0).ok,'人間が着手できる');
  await sleep(850);
  check(game.getState().moveCount===3,'CPUが白と赤の2手を実行');
  check(game.getState().currentPlayer==='black','CPU後は黒の手番に戻る');
  check(game.setCpuLevel('hard').ok,'強いCPUに変更できる');
  check(game.exportRecord().cpuLevel==='hard','棋譜にもCPU難易度が保存される');
  const savedRecord=game.exportRecord();
  check(game.importRecord(savedRecord).ok,'v0.4の設定付き棋譜を復元できる');
  check(game.getPresentation().cpuLevel==='hard','棋譜からCPU難易度が復元される');
  check(game.reset({mode:'local',radius:2}).ok,'自動対局の準備');
  const result=game.autoPlay(50,12);
  check(result.ok && result.state.ended,'CPU自動対局が終局まで進む');
  check(Object.values(result.state.scores).reduce((a,b)=>a+b,0)<=19,'盤面の点数が正当');
  check(game.reset({mode:'local',radius:2}).ok,'危険な石の表示検証用に盤面を初期化');
  game.setHints({danger:true,legal:false});
  check(game.play(0,0).ok,'危険表示検証: 黒を配置');
  check(game.play(1,0).ok,'危険表示検証: 白を配置');
  check(game.play(1,-1).ok,'危険表示検証: 赤を配置');
  check(game.pass().ok,'危険表示検証: 黒パス');
  check(game.play(0,-1).ok,'危険表示検証: 白で包囲');
  check(game.play(-1,0).ok,'危険表示検証: 赤で包囲');
  check(game.pass().ok,'危険表示検証: 黒パス2');
  check(game.play(-1,1).ok,'危険表示検証: 呼吸点1の黒石を作る');
  check(game.getPresentation().dangerGroups.some(g=>g.color==='black'&&g.stones.includes('0,0')),'黒の呼吸点1をAPIで認識');
  check(doc.querySelector('g.cell[data-q="0"][data-r="0"] .hintDanger')!==null,'危険な石に赤いリングが表示される');
  doc.getElementById('dangerToggle').click();
  check(doc.querySelector('g.cell[data-q="0"][data-r="0"] .hintDanger')===null,'危険リングを非表示にできる');
  // Mock just the PeerJS signaling event to exercise online host lobby
  // in Chrome without relying on the public network inside CI.
  class FakePeer {
    constructor(id){this.id=id;this.callbacks={};
      queueMicrotask(()=>this.callbacks.open?.(id));}
    on(name,fn){this.callbacks[name]=fn;}
    destroy(){}
  }
  win.Peer=FakePeer;
  check(game.reset({mode:'online',radius:2}).ok,'テスト用のオンライン対戦モードを開始');
  check(game.getPresentation().mode==='online','v1.2オンライン対戦モードに切り替え');
  check(!doc.querySelector('#onlinePanel').hidden,'オンライン部屋の操作欄が見える');
  check(!!doc.querySelector('.advancedNetwork')&&!doc.querySelector('.advancedNetwork').open,
    'サーバーURLは初期状態で詳細設定に隠れる');
  check(!game.openReplay().ok,'オンライン対局中はホストの棋譜再生を禁止');
  doc.querySelector('#onlineCreate').click();
  await sleep(80);
  check(game.getOnlineStatus().host&&game.getOnlineStatus().seat===0,
    '実ブラウザでホストの部屋を作成');
  check(doc.querySelector('#onlineRoom').value.includes('room=tgo-'),
    '共有可能な招待URLを表示');
  check(!game.play(0,0).ok && game.getState().moveCount===0,
    '3人揃うまでオンライン対局は着手できない');
  check(!game.undo().ok,'オンライン対局ではUndoによる状態不一致を防ぐ');
  doc.querySelector('#onlineLeave').click();
  check(game.getPresentation().mode==='local','オンライン部屋から退室してローカルへ戻る');
  const offline=document.createElement('iframe');
  offline.title='単一HTMLオフライン版';
  offline.src='../play.html';
  const offlineReady=new Promise((resolve,reject)=>{
    offline.addEventListener('load',resolve,{once:true});
    offline.addEventListener('error',()=>reject(new Error('play.htmlの読み込み失敗')),{once:true});
  });
  document.body.appendChild(offline);
  await offlineReady;
  const standalone=offline.contentWindow.threeColorGo;
  check(standalone && typeof standalone.play==='function','オフライン版のゲームAPIが起動');
  check(standalone.reset({mode:'local',radius:2}).ok,'オフライン版を初期化');
  check(standalone.play(0,0).ok,'オフライン版で着手できる');
  check(standalone.getState().scores.black===1,'オフライン版で得点を表示');
  check(standalone.version==='1.4.1','オフライン版がv1.4.1へ同期している');
  check(standalone.setCpuLevel('easy').ok,'オフライン版でも難易度を変更できる');
  check(standalone.setHints({legal:true}).ok,'オフライン版でも合法手ガイドを切り替えられる');
  check(standalone.openReplay().ok && standalone.seekReplay(0).ok,
    'オフライン版でも棋譜を再生できる');
  check(standalone.closeReplay().ok,'オフライン版でも元の対局へ戻れる');
  check(standalone.reset({mode:'bots',radius:3,cpuLevel:'easy'}).ok,'オフライン版にもCPU3人観戦モードがある');
  check(standalone.pauseBots().ok && standalone.stepBot().ok,'オフライン版も一時停止して1手進められる');
  check(standalone.reset({mode:'local',radius:11}).ok,'オフライン版でも397マスで初期化');
  check(!standalone.getPresentation().zoomBoard,'オフライン版でも全体表示が標準');
  check(standalone.setBoardZoom(true).ok && standalone.getPresentation().zoomBoard,'オフライン版でも手動で拡大できる');
  check(typeof standalone.analyze==='function'&&typeof standalone.getOnlineStatus==='function',
    'オフライン版にも分析・オンライン接続APIを統合');
  status.className='ok';status.dataset.status='passed';status.textContent='PASS — '+lines.length+'件のブラウザ操作テスト成功';
}
frame.addEventListener('load',()=>{
  run().catch(e=>{
    status.className='fail';status.dataset.status='failed';status.textContent='FAIL: '+e.message;
    lines.push('FAIL: '+e.stack);log.textContent=lines.join('\n');
  });
},{once:true});
setTimeout(()=>{
  if(status.dataset.status!=='passed'&&status.dataset.status!=='failed'){
    status.className='fail';status.dataset.status='failed';status.textContent='FAIL: 読み込みタイムアウト';
  }
},30000);
</script>
</body>
</html>
